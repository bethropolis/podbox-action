name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: just check

  # Runs the real action end to end against podbox v0.9.3+. Set the repository
  # variable PODBOX_PUBLISH_AVAILABLE=true to enable it.
  self-test:
    if: ${{ vars.PODBOX_PUBLISH_AVAILABLE == 'true' }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install skopeo/podman for base image digest resolution
        run: sudo apt-get update -y && sudo apt-get install -y skopeo podman
      - name: Debug skopeo base image resolution
        run: |
          echo "=== alpine:latest ==="
          skopeo inspect --raw docker://alpine:latest 2>&1; echo "EXIT=$?"
          echo "=== alpine@sha256 digest ==="
          skopeo inspect --raw docker://alpine@sha256:c26612752c78b18faacd63c7d50f4592c2e7b0f25e0e20e82bd74e465c57ab0d 2>&1; echo "EXIT=$?"
          echo "=== docker.io/library/alpine:3.24 ==="
          skopeo inspect --raw docker://docker.io/library/alpine:3.24 2>&1; echo "EXIT=$?"
      - id: pub
        uses: ./
        with:
          working-directory: tests/fixtures/repos/multi
          images: images.toml
          push: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
      - name: Check outputs
        env:
          IMAGES: ${{ steps.pub.outputs.images }}
        run: |
          echo "$IMAGES" | jq .
          echo "$IMAGES" | jq -e 'length == 2'
